version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: digital-taxonomist-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/taxonomist2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./data/neo4j:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "neo4j status | grep -q 'Neo4j is running'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j-data:
  neo4j-logs:
