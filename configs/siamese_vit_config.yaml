# Siamese Vision Transformer — Training Configuration
# Digital Taxonomist: Aquatic Hyphomycetes Classification

model:
  backbone: "vit_small_patch16_224"
  embedding_dim: 256
  pretrained: true
  freeze_layers: 6  # Freeze first 6 of 12 ViT blocks

training:
  loss: "triplet"  # "contrastive" or "triplet"
  triplet_margin: 0.3
  contrastive_margin: 1.0
  optimizer: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_epochs: 5
  epochs: 100
  batch_size: 32
  num_workers: 4
  mixed_precision: true  # FP16 training

data:
  image_size: 224
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  graph_json: "data/neo4j/aquatic_hyphomycetes_graph.json"
  hard_negative_ratio: 0.5  # 50% of negatives are hard (same morphotype, different genus)

  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotation_degrees: 180  # Microscopy images have no canonical orientation
    brightness_range: [0.8, 1.2]
    contrast_range: [0.8, 1.2]
    gaussian_blur_sigma: [0.1, 2.0]
    elastic_transform: true  # Simulate specimen deformation
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]

  class_balance:
    strategy: "oversampling"  # "oversampling", "class_weights", or "none"
    min_samples_per_class: 20

evaluation:
  k_shot: [1, 3, 5, 10]  # Few-shot evaluation
  metrics: ["accuracy", "precision", "recall", "f1", "confusion_matrix"]
  save_embeddings: true  # For t-SNE visualization

output:
  checkpoint_dir: "models/checkpoints"
  best_model_path: "models/siamese_vit_best.pth"
  log_dir: "models/logs"
  save_every_n_epochs: 10

neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "${NEO4J_PASSWORD}"
  validate_predictions: true
